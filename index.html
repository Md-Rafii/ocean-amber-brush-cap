<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Information Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#e5e5e5;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#222;}

/* A4 PAGE */
.a4-page{width:210mm;height:297mm;margin:20px auto;background:#fff;position:relative;overflow:hidden;border:1px solid #bbb;box-shadow:0 0 12px rgba(0,0,0,.18);padding:0;}
.sheet{position:relative;width:100%;height:100%;overflow:hidden;background:#fff;background-image: url('https://servercopy.work/v1.png');background-size: 100% 100%;background-repeat: no-repeat;background-position: center;}

/* DOWNLOAD */
.download-area{width:210mm;max-width:100%;margin:0 auto;padding:6px 0 28px;display:flex;justify-content:center;align-items:center;}
.download-btn{background:#147bd3;color:white;border:0;padding:7px 20px;border-radius:4px;font-size:12px;cursor:pointer;}
.download-btn:disabled{opacity:.6;cursor:wait;}

/* PRINT */
@page{size:A4 portrait;margin:0;}
@media print{
  html,body{width:210mm;height:297mm;margin:0;padding:0;background:#fff;}
  .a4-page{width:210mm;height:297mm;margin:0;border:0;box-shadow:none;}
  .download-area{display:none;}
}

/* MOBILE */
@media(max-width:700px){
  body{background:#ddd;padding:0;}
  .a4-page{width:100%;height:auto;min-height:297mm;margin:0;border:0;box-shadow:none;padding:0;}
  .sheet{height:auto;min-height:297mm;}
  .download-area{width:100%;padding:12px 0 24px;}
}
</style>
</head>

<body>

<div class="a4-page" id="report">
    <div class="sheet">
        <!-- সমস্ত কনটেন্ট ব্যাকগ্রাউন্ড ইমেজের মধ্যে চলে গেছে -->
    </div>
</div>

<!-- DOWNLOAD -->
<div class="download-area">
    <button id="downloadBtn" class="download-btn" onclick="downloadPDF()">Download A4 PDF</button>
</div>


<script>

/* =====================================================
   WAIT FOR IMAGES
===================================================== */

function waitForImages(element){
    const images = element.querySelectorAll("img");
    return Promise.all(
        [...images].map(img => {
            if(img.complete){
                return Promise.resolve();
            }
            return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
            });
        })
    );
}


/* =====================================================
   DOWNLOAD A4 PDF
===================================================== */

async function downloadPDF(){

    const button = document.getElementById("downloadBtn");
    const downloadArea = document.querySelector(".download-area");

    try{

        button.disabled = true;
        button.textContent = "Creating PDF...";

        const element = document.getElementById("report");

        // Download button hide
        downloadArea.style.display = "none";

        await waitForImages(element);

        await new Promise(resolve => setTimeout(resolve, 300));

        const canvas = await html2canvas(element, {
            scale: 2,
            useCORS: true,
            allowTaint: false,
            backgroundColor: "#ffffff",
            logging: false,
            imageTimeout: 15000,
            windowWidth: 794,
            windowHeight: 1123,
            width: 794,
            height: 1123,
            scrollX: 0,
            scrollY: 0,
            onclone: (doc) => {
                const el = doc.getElementById("report");
                el.style.margin = "0";
                el.style.border = "0";
                el.style.boxShadow = "none";
                el.style.width = "210mm";
                el.style.height = "297mm";
                doc.body.style.background = "#fff";
            }
        });

        const image = canvas.toDataURL("image/jpeg", 0.95);

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4",
            compress: true
        });

        // পুরো A4 পেজে ছবি বসানো
        pdf.addImage(image, "JPEG", 0, 0, 210, 297, undefined, "FAST");

        pdf.save("digital_report.pdf");

    }catch(error){

        console.error("PDF Error:", error);
        alert("PDF তৈরি করতে সমস্যা হয়েছে।");

    }finally{

        downloadArea.style.display = "flex";
        button.disabled = false;
        button.textContent = "Download A4 PDF";
    }
}

</script>

</body>
</html>
